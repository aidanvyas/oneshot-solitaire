[package]
name = "oneshot-solver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oneshot-solver"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
